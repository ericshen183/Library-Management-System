<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Design Neumorphism</title>
    <!--=========================www.material design iconic font========================================-->
    <link rel="stylesheet" type="text/css" href="fonts/iconic/css/material-design-iconic-font.min.css">
    <link rel="stylesheet" href="Style.css">

</head>

<body>

    <div class="limiter">
        <div class="container-login">
            <div class="wrap-login">
                <form class="login-form validate-form" id="loginForm">
                    <span class="login-form-title">
                        Account Login
                    </span>

                    <!-- Status Text for Errors -->
                    <div id="loginStatus" class="text-center" style="margin-bottom: 20px; font-weight: bold;"></div>

                    <div class="wrap-input validate-input" data-validate="Login ID is required">
                        <input class="input" type="text" name="loginId" id="loginId">
                        <span class="focus-input" data-placeholder="Member or Librarian ID"></span>
                    </div>

                    <div class="wrap-input validate-input" data-validate="Password is required">
                        <input class="input" type="password" name="password" id="loginPassword">
                        <span class="focus-input" data-placeholder="Password"></span>
                    </div>

                    <div class="container-login-form-btn">
                        <div class="wrap-login-form-btn">
                            <button class="login-form-btn"> Login </button>
                        </div>
                    </div>
                    <div class="text-center" style="margin-top: 20px; font-size: 13px; color: #666;">
                        Log in with the account ID and password stored in MongoDB.
                    </div>
                    <div class="text-center" style="margin-top: 20px;">
                        <span class="txt1">
                            Don't have an account?
                        </span>
                        <a class="txt2" href="Register.html"> Sign Up </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="js/jquery-3.2.1.min.js"></script>
    <script type="module" src="JS_main.js"></script>



</body>
</html>
